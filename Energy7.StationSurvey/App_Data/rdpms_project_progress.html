<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDPMS Project Progress</title>
<style>
:root{
  --bg:#f7f2ea;--panel:#fffdf9;--panel2:#fbf6ee;--fg:#2b2622;--muted:#8a7f73;--line:#eadfce;--line2:#f0e6d8;
  --accent:#1e7a4c;--accent-fg:#ffffff;--accent-soft:#e3f1e8;
  --ok:#1f7a45;--ok-bg:#dcefe2;--warn:#c2410c;--warn-bg:#fdeee2;--warn-soft:#fff5ec;--zero:#b9ada0;
  --bad:#b42318;--bad-bg:#fbe7e4;--chip:#f3ebe0;--radius:12px;--overlay:rgba(43,38,34,.4);--shadow:0 1px 2px rgba(60,40,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14120f;--panel:#1c1915;--panel2:#221e1a;--fg:#ece6dd;--muted:#a39888;--line:#332d26;--line2:#2a251f;
    --accent:#4cc27e;--accent-fg:#0d1a12;--accent-soft:#1b2e22;
    --ok:#5fd18c;--ok-bg:#1a3123;--warn:#ff9a5c;--warn-bg:#3a2416;--warn-soft:#2a1d14;--zero:#5e554b;
    --bad:#ff7a6b;--bad-bg:#3a1f1b;--chip:#2a251f;--overlay:rgba(0,0,0,.6);--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14120f;--panel:#1c1915;--panel2:#221e1a;--fg:#ece6dd;--muted:#a39888;--line:#332d26;--line2:#2a251f;
  --accent:#4cc27e;--accent-fg:#0d1a12;--accent-soft:#1b2e22;
  --ok:#5fd18c;--ok-bg:#1a3123;--warn:#ff9a5c;--warn-bg:#3a2416;--warn-soft:#2a1d14;--zero:#5e554b;
  --bad:#ff7a6b;--bad-bg:#3a1f1b;--chip:#2a251f;--overlay:rgba(0,0,0,.6);--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding:14px 16px 44px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700}
.saved{font-size:12px;color:var(--muted)}
.recas{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.recas b{color:var(--fg);font-weight:700}
.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.banner{border:1px solid #f1c9a5;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px}
:root[data-theme="dark"] .banner{border-color:var(--line)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:820px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
select,input[type=number],input[type=text],input[type=date],textarea{font:inherit;font-size:14px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:56px;resize:vertical}
.btn{font:inherit;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* station detail */
.detail{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.strip-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.strip-t{font-size:17px;font-weight:700;margin:0}
.strip-t small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--fg);border-radius:6px;padding:3px 9px}
.chip .k{color:var(--muted);font-weight:500}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;margin-top:1px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
/* stage tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:9px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:var(--panel2);cursor:pointer;transition:box-shadow .15s}
.tile:hover{box-shadow:0 0 0 2px var(--accent) inset}
.tile.ok{border-color:var(--ok);background:var(--ok-bg)}
.tile.warn{border-color:var(--warn);background:var(--warn-soft)}
.tile .t{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.tile .dot{width:9px;height:9px;border-radius:3px;flex:none}
.tile .st{font-size:12.5px;font-weight:700}
.tile.ok .st{color:var(--ok)}.tile.warn .st{color:var(--warn)}
.tile .r{font-size:11.5px;color:var(--muted)}
.qctag{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;align-self:flex-start}
.qctag.ok{background:var(--ok-bg);color:var(--ok)}.qctag.no{background:var(--bad-bg);color:var(--bad)}
.bar{height:6px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--warn)}
.bar>i.full{background:var(--ok)}
.items{margin-top:2px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:11px;line-height:1.35}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--panel) 75%,transparent)}
.it .in{font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .iv{font-weight:700;white-space:nowrap}
.it.ok .iv{color:var(--ok)}.it.warn .iv{color:var(--warn)}.it.zero .iv{color:var(--muted)}.it.na .iv{color:var(--zero);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.welcome{max-width:720px;margin:34px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 26px;box-shadow:var(--shadow)}
.welcome .wi{width:56px;height:56px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.welcome h2{margin:0 0 6px;font-size:19px}
.welcome p{margin:0 auto 20px;max-width:440px;color:var(--muted);font-size:13.5px}
.pl-t{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.pipeline{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.pstep{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 9px}
.pstep .d{width:9px;height:9px;border-radius:3px;flex:none}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--fg);width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:var(--overlay)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-h{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg-h .no{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.dlg-h h2{margin:0;font-size:16px}
.dlg-b{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.dlg-f .right{display:flex;gap:8px;margin-left:auto}
.dlg-f .msg{font-size:12px;color:var(--muted)}
.sec-t{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 13px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);box-shadow:var(--shadow)}
.seg button[data-v="1"][aria-pressed=true]{color:var(--bad)}
.seg button[data-v="2"][aria-pressed=true]{color:var(--warn)}
.seg button[data-v="3"][aria-pressed=true]{color:var(--ok)}
.seg.qc button[data-v="1"][aria-pressed=true]{color:var(--ok)}
.seg.qc button[data-v="2"][aria-pressed=true]{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
table.ed{width:100%;border-collapse:collapse;font-size:13px}
table.ed th,table.ed td{padding:6px 7px;border-bottom:1px solid var(--line2);text-align:left}
table.ed th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
table.ed td.n,table.ed th.n{text-align:right;width:76px}
table.ed input[type=number]{width:66px;padding:5px 7px}
table.ed .plan{color:var(--muted);font-weight:600}
.tvc-scroll{max-height:340px;overflow:auto;border:1px solid var(--line2);border-radius:9px}
table.ed.tvc{font-size:12.5px}
table.ed.tvc thead th{position:sticky;top:0;background:var(--panel);z-index:1}
table.ed th.c,table.ed td.c{text-align:center;width:52px}
table.ed.tvc td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
table.ed.tvc input[type=checkbox]{width:17px;height:17px;cursor:pointer}
table.ed.tvc tr:has(input:checked){background:var(--ok-bg)}
.tvc-hint{font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><h1>RDPMS Project Progress</h1><span class="saved" id="savedState"></span></div>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="filters">
    <div class="field"><label for="fZone">Zone</label><select id="fZone"></select></div>
    <div class="field"><label for="fDivision">Division</label><select id="fDivision"></select></div>
    <div class="field"><label for="fStation">Station</label><select id="fStation"></select></div>
  </div>

  <section class="detail" id="detail" hidden></section>
  <div id="empty" class="empty">Select a station to record its project progress.</div>
</div>

<dialog id="stageDlg"><form class="dlg" method="dialog" id="stageForm"></form></dialog>
<div class="toast" id="toast"></div>

<script>
// Project Progress - prototype tile-grid look, driven by the real backend.
// Logged-in user is recorded automatically on save. JSON is camelCase.
const $ = (id) => document.getElementById(id);
const base = '/ProjectProgress/';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1900); };
const fmtDate = (d) => { if (!d) return ''; const x = new Date(String(d).slice(0,10) + 'T00:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); };

async function apiGet(p) { const r = await fetch(base + p, { headers: { 'Accept':'application/json' } }); return r.json(); }
async function apiPost(p, b) { const r = await fetch(base + p, { method:'POST', headers:{ 'Content-Type':'application/json','Accept':'application/json' }, body: JSON.stringify(b) }); return r.json(); }

const BOOT = { me:null, statuses:[], qc:[] };
let STAGES = [], READY = false, SITE = 0, PROG = {};
// Attribute-wise checklist (Termination / Validation / Calibration): yard rows + per-stage ticks
const TVC = ['TERMINATION','VALIDATION','CALIBRATION'];
let YARD = { siteId:0, rows:[], total:0, stages:{} };
const isTvc = (st) => st && TVC.indexOf(String(st.code||'').toUpperCase()) >= 0;

const statusName = (id) => (BOOT.statuses.find((s) => s.id === id) || {}).name || (id ? '' : 'Not started');
const cellState = (d, t) => (t > 0 && d >= t ? 'ok' : d > 0 ? 'warn' : 'zero');

function opt(v, t) { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; }
function fill(sel, list, ph) { sel.replaceChildren(); if (ph != null) sel.append(opt('', ph)); list.forEach((x) => sel.append(opt(x.id, x.name + (x.code ? ' · ' + x.code : '')))); }

async function boot() {
  try {
    const b = await apiGet('GetBootstrap');
    if (b.error) { toast(b.error); return; }
    BOOT.me = b.me; BOOT.statuses = b.statuses || []; BOOT.qc = b.qc || [];
    fill($('fZone'), b.zones || [], 'All zones');
    const sres = await apiGet('GetStages');
    READY = !!sres.ready; STAGES = sres.stages || [];
    if (!READY) { const el = $('banner'); el.hidden = false; el.textContent = 'Backend not live yet — the stages are shown for preview and saving is disabled until the Project Progress API is running.'; }
    renderEmpty();
  } catch (e) { toast('Could not load. ' + e.message); }
}

function renderEmpty() {
  const steps = STAGES.map((st) => '<span class="pstep"><span class="d" style="background:' + esc(st.colorCode || '#888') + '"></span>' + String(st.sequenceNo).padStart(2,'0') + ' ' + esc(st.name) + '</span>').join('');
  $('empty').innerHTML = '<div class="welcome">' +
    '<div class="wi"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>' +
    '<h2>Select a station</h2>' +
    '<p>Choose a zone, division and station above to view and record its project progress across every stage.</p>' +
    (steps ? '<div class="pl-t">The ' + STAGES.length + ' project stages</div><div class="pipeline">' + steps + '</div>' : '') +
    '</div>';
}

$('fZone').addEventListener('change', async function () {
  const d = await apiGet('GetDivisions?zoneId=' + (this.value || 0));
  fill($('fDivision'), Array.isArray(d) ? d : [], 'All divisions');
  $('fStation').replaceChildren(opt('', 'Select station')); clearStation();
});
$('fDivision').addEventListener('change', async function () {
  const s = await apiGet('GetStations?divisionId=' + (this.value || 0));
  fill($('fStation'), Array.isArray(s) ? s : [], 'Select station'); clearStation();
});
$('fStation').addEventListener('change', function () { const id = +this.value || 0; if (id) loadProgress(id); else clearStation(); });

function clearStation() { SITE = 0; PROG = {}; $('detail').hidden = true; $('empty').hidden = false; renderEmpty(); }

async function loadProgress(siteId) {
  SITE = siteId; PROG = {}; YARD = { siteId:0, rows:[], total:0, stages:{} };
  $('empty').hidden = true; $('detail').hidden = false; $('detail').innerHTML = '<div class="empty">Loading…</div>';
  let res = {}, yard = {};
  try { [res, yard] = await Promise.all([apiGet('GetProgress?siteId=' + siteId), apiGet('GetYardChecklist?siteId=' + siteId)]); } catch (e) {}
  if (res && res.ready && Array.isArray(res.stages)) res.stages.forEach((p) => { PROG[p.projectStageId] = p; });
  if (yard && yard.ready) YARD = { siteId:siteId, rows:yard.rows||[], total:yard.total||0, stages:yard.stages||{} };
  renderDetail();
}

// checklist summary for a TVC stage (from the yard ticks), or null
function tvcSummary(st) {
  if (!isTvc(st)) return null;
  return YARD.stages[String(st.code).toUpperCase()] || { doneCount:0, total:YARD.total, status:'NotComplete', statusId:1, checks:{} };
}

// progress for a stage: use item done/planned totals, else status
function stagePct(p) {
  const plan = +p.plannedQty || 0, dn = +p.doneQty || 0;
  if (plan > 0) return Math.round(dn / plan * 100);
  return (p.progressStatusId === 3) ? 100 : 0;
}

function renderDetail() {
  const el = $('detail'); el.replaceChildren();
  const stName = $('fStation').selectedOptions[0] ? $('fStation').selectedOptions[0].textContent : 'Station';
  const zone = $('fZone').selectedOptions[0] ? $('fZone').selectedOptions[0].textContent : '';
  const div = $('fDivision').selectedOptions[0] ? $('fDivision').selectedOptions[0].textContent : '';

  let complete = 0, done = 0, total = 0;
  STAGES.forEach((st) => {
    const p = PROG[st.id] || {}, tv = tvcSummary(st);
    const status = tv ? tv.statusId : (p.progressStatusId || 1);
    if (status === 3) complete++;
    done += tv ? (tv.doneCount||0) : (+p.doneQty||0);
    total += tv ? (tv.total||0) : (+p.plannedQty||0);
  });
  const overall = total ? Math.round(done/total*100) : Math.round(complete/Math.max(1,STAGES.length)*100);

  // header
  const head = document.createElement('div'); head.className = 'strip-h';
  const left = document.createElement('div');
  left.innerHTML = '<h2 class="strip-t">' + esc(stName) + '</h2>';
  const chips = document.createElement('div'); chips.className = 'chips';
  const chip = (k,v,cls) => { if(!v) return; const c=document.createElement('span'); c.className='chip '+(cls||''); c.innerHTML=(k?'<span class="k">'+esc(k)+'</span> ':'')+esc(v); chips.append(c); };
  if (zone && zone !== 'All zones') chip('Zone', zone);
  if (div && div !== 'All divisions') chip('Division', div);
  chip('', complete === STAGES.length && STAGES.length ? 'All stages complete' : complete + ' / ' + STAGES.length + ' stages complete', complete === STAGES.length && STAGES.length ? 'ok' : 'warn');
  left.append(chips); head.append(left); el.append(head);

  // stats
  const stats = document.createElement('div'); stats.className = 'stats';
  stats.innerHTML =
    '<div class="stat"><div class="l">Stages</div><div class="v">' + STAGES.length + '</div></div>' +
    '<div class="stat"><div class="l">Complete</div><div class="v">' + complete + ' <small>/ ' + STAGES.length + '</small></div></div>' +
    '<div class="stat"><div class="l">Items done</div><div class="v">' + done + ' <small>/ ' + total + '</small></div></div>' +
    '<div class="stat"><div class="l">Overall progress</div><div class="v">' + overall + '%</div></div>';
  el.append(stats);

  // tiles
  const firstOpen = STAGES.find((st) => { const tv = tvcSummary(st); return (tv ? tv.statusId : ((PROG[st.id] || {}).progressStatusId || 1)) !== 3; });
  const tiles = document.createElement('div'); tiles.className = 'tiles';
  STAGES.forEach((st) => tiles.append(stageTile(st, PROG[st.id] || { projectStageId: st.id, progressStatusId: 0, items: [] }, firstOpen && firstOpen.id === st.id)));
  el.append(tiles);
}

function stageTile(st, p, isNow) {
  const tv = tvcSummary(st);
  // Status: TVC stages derive from the attribute checklist; others from the saved header (default Not Complete=1).
  const status = tv ? tv.statusId : (p.progressStatusId || 1);
  const tile = document.createElement('div');
  tile.className = 'tile' + (status === 3 ? ' ok' : status === 2 ? ' warn' : '');
  const items = Array.isArray(p.items) ? p.items : [];
  const plan = tv ? (tv.total || 0) : (+p.plannedQty || 0), dn = tv ? (tv.doneCount || 0) : (+p.doneQty || 0);
  const pct = tv ? (plan ? Math.round(dn / plan * 100) : 0) : stagePct(p);

  let h = '<div class="t"><span class="dot" style="background:' + esc(st.colorCode || '#888') + '"></span>' + String(st.sequenceNo).padStart(2,'0') + ' · ' + esc(st.name) + '</div>';
  h += '<div class="st">' + esc(statusName(status)) + '</div>';
  h += '<div class="bar"><i class="' + (pct>=100?'full':'') + '" style="width:' + Math.min(100,pct) + '%"></i></div>';
  h += '<div class="r">' + (tv ? (plan ? dn + ' / ' + plan + ' attributes' : 'No attributes wired') : (plan ? dn + ' / ' + plan + ' done' : (status===3?'Complete':status===2?'Partial':'Not complete'))) + (isNow && status!==3 ? ' · current' : '') + '</div>';
  if (p.qcStatus) h += '<span class="qctag ' + (p.qcStatus===1?'ok':'no') + '">QC ' + (p.qcStatus===1?'OK':'Not OK') + '</span>';
  tile.innerHTML = h;

  if (items.length) {
    const box = document.createElement('div'); box.className = 'items';
    items.forEach((it) => {
      const t = it.plannedQty == null ? 0 : it.plannedQty;
      const d = it.isDone != null ? (it.isDone ? 1 : 0) : (it.doneQty || 0);
      const tot = it.isDone != null ? 1 : t;
      const line = document.createElement('div'); line.className = 'it ' + (tot ? cellState(d, tot) : 'na');
      line.innerHTML = '<span class="in">' + esc(it.itemLabel || it.itemCode) + '</span><span class="iv">' + (it.isDone != null ? (it.isDone ? 'Done' : '—') : (tot ? d + '/' + tot : '—')) + '</span>';
      box.append(line);
    });
    tile.append(box);
  }
  tile.addEventListener('click', () => openDlg(st, p));
  return tile;
}

// ── stage edit dialog ──
function openDlg(st, p) {
  const form = $('stageForm'); form.replaceChildren();
  const tvcSt = isTvc(st), tv0 = tvcSummary(st);
  // Default "Not Complete" (id 1) for every stage; TVC stages reflect the derived checklist status.
  let curStatus = tvcSt ? (tv0 ? tv0.statusId : 1) : (p.progressStatusId || 1), curQc = p.qcStatus || 0;
  const itemRows = [];

  // header
  const head = document.createElement('div'); head.className = 'dlg-h';
  head.innerHTML = '<span class="no" style="background:' + esc(st.colorCode || '#888') + '">' + String(st.sequenceNo).padStart(2,'0') + '</span><div><h2>' + esc(st.name) + '</h2></div>';
  form.append(head);

  const body = document.createElement('div'); body.className = 'dlg-b';

  // status
  const sWrap = document.createElement('div'); sWrap.innerHTML = '<div class="sec-t">Status</div>';
  const seg = document.createElement('div'); seg.className = 'seg';
  const setStatus = (id) => { curStatus = id; seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', +x.dataset.v === curStatus)); };
  BOOT.statuses.forEach((s) => { const b=document.createElement('button'); b.type='button'; b.dataset.v=s.id; b.textContent=s.name; b.setAttribute('aria-pressed',curStatus===s.id); if (tvcSt) { b.disabled=true; b.title='Set automatically from the attribute checklist below'; } else { b.addEventListener('click',()=>setStatus(s.id)); } seg.append(b); });
  sWrap.append(seg);
  if (tvcSt) { const hint=document.createElement('div'); hint.className='tvc-hint'; hint.textContent='Status updates automatically from the attribute checklist: all done → Completed, some done → Partial Complete, none → Not Complete.'; sWrap.append(hint); }
  body.append(sWrap);

  if (tvcSt) {
    // Attribute-wise checklist (Cluster / Location / Asset Type / Asset / Attribute / ADC) — check / uncheck
    body.append(buildYardChecklist(st, setStatus));
  } else {
    // items
    const items = Array.isArray(p.items) ? p.items : [];
    if (items.length) {
      const box = document.createElement('div'); box.innerHTML = '<div class="sec-t">Items — planned vs done</div>';
      const tbl = document.createElement('table'); tbl.className='ed';
      tbl.innerHTML = '<thead><tr><th>Item</th><th class="n">Planned</th><th class="n">Done</th><th>Remark</th></tr></thead>';
      const tb = document.createElement('tbody');
      items.forEach((it) => {
        const tr = document.createElement('tr');
        const checkMode = it.isDone != null && it.plannedQty == null;
        let getVal;
        const tdL = document.createElement('td'); tdL.innerHTML = '<b>' + esc(it.itemLabel||it.itemCode) + '</b>';
        const tdP = document.createElement('td'); tdP.className='n plan'; tdP.textContent = it.plannedQty==null ? (checkMode?'—':'0') : it.plannedQty;
        const tdD = document.createElement('td'); tdD.className='n';
        if (checkMode) { const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=it.isDone===true; tdD.append(cb); getVal=()=>({isDone:cb.checked,doneQty:null}); }
        else { const inp=document.createElement('input'); inp.type='number'; inp.min=0; if(it.plannedQty!=null)inp.max=it.plannedQty; inp.value=it.doneQty||0; tdD.append(inp); getVal=()=>({isDone:null,doneQty:Math.max(0,+inp.value||0)}); }
        const tdR = document.createElement('td'); const rem=document.createElement('input'); rem.type='text'; rem.value=it.remarks||''; tdR.append(rem);
        tr.append(tdL,tdP,tdD,tdR); tb.append(tr);
        itemRows.push(() => Object.assign({}, it, getVal(), { remarks: rem.value||null, doneBy:null, siteId:SITE, projectStageId:st.id }));
      });
      tbl.append(tb); box.append(tbl); body.append(box);
    }
  }

  // remarks + done date
  const grid = document.createElement('div'); grid.className='grid2';
  const rb = document.createElement('div'); rb.innerHTML='<div class="sec-t">Remarks</div>';
  const remarks = document.createElement('textarea'); remarks.value = p.remarks || ''; rb.append(remarks);
  const db = document.createElement('div'); db.innerHTML='<div class="sec-t">Done date</div>';
  const doneDate = document.createElement('input'); doneDate.type='date'; doneDate.value = p.doneDate ? String(p.doneDate).slice(0,10) : ''; db.append(doneDate);
  if (p.doneByName) { const w=document.createElement('div'); w.className='saved'; w.style.marginTop='8px'; w.textContent='Recorded by '+p.doneByName+(p.doneDate?' · '+fmtDate(p.doneDate):''); db.append(w); }
  grid.append(rb, db); body.append(grid);

  // QC
  const qb = document.createElement('div'); qb.innerHTML='<div class="sec-t">Quality Check (QA team)</div>';
  const qseg = document.createElement('div'); qseg.className='seg qc';
  [{id:0,name:'Pending'},{id:1,name:'OK'},{id:2,name:'Not OK'}].forEach((q)=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=q.id; b.textContent=q.name; b.setAttribute('aria-pressed',curQc===q.id); b.addEventListener('click',()=>{curQc=q.id;qseg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===curQc));}); qseg.append(b); });
  qb.append(qseg);
  const qr = document.createElement('div'); qr.style.marginTop='10px'; qr.innerHTML='<div class="sec-t">QC remark</div>';
  const qcRemarks = document.createElement('textarea'); qcRemarks.value = p.qcRemarks || ''; qr.append(qcRemarks);
  if (p.qcByName) { const w=document.createElement('div'); w.className='saved'; w.style.marginTop='8px'; w.textContent='Checked by '+p.qcByName+(p.qcDate?' · '+fmtDate(p.qcDate):''); qr.append(w); }
  qb.append(qr); body.append(qb);
  form.append(body);

  // footer
  const foot = document.createElement('div'); foot.className='dlg-f';
  const msg = document.createElement('span'); msg.className='msg'; if (p.lastModifiedDate) msg.textContent='Last saved '+fmtDate(p.lastModifiedDate);
  const right = document.createElement('div'); right.className='right';
  const cancel = document.createElement('button'); cancel.type='button'; cancel.className='btn'; cancel.textContent='Cancel'; cancel.addEventListener('click',()=>$('stageDlg').close());
  const save = document.createElement('button'); save.type='button'; save.className='btn primary'; save.textContent='Save'; save.disabled=!READY; if(!READY)save.title='Saving disabled until the backend is live';
  save.addEventListener('click', async () => {
    save.disabled=true; save.textContent='Saving…';
    const payload = { id:p.id||0, siteId:SITE, projectStageId:st.id, progressStatusId:curStatus, remarks:remarks.value||null, doneBy:null, doneDate:doneDate.value||null, qcStatus:curQc||null, qcRemarks:qcRemarks.value||null, qcBy:null, items:itemRows.map(fn=>fn()) };
    try {
      const r = await apiPost('SaveStage', payload);
      if (r && r.success) { toast(st.name+' saved'); $('savedState').textContent='Saved · '+new Date().toLocaleTimeString(); $('stageDlg').close(); await loadProgress(SITE); }
      else if (r && r.ready===false) { toast('Backend not live — not saved'); save.disabled=false; save.textContent='Save'; }
      else { toast((r&&r.error)||'Save failed'); save.disabled=false; save.textContent='Save'; }
    } catch (e) { toast('Save failed: '+e.message); save.disabled=false; save.textContent='Save'; }
  });
  right.append(cancel, save); foot.append(msg, right); form.append(foot);

  $('stageDlg').showModal();
}

// ── attribute-wise checklist (Termination / Validation / Calibration) ──
function buildYardChecklist(st, setStatus) {
  const code = String(st.code).toUpperCase();
  const sum = YARD.stages[code] || { checks:{}, doneCount:0, total:YARD.total };
  const wrap = document.createElement('div');
  const head = document.createElement('div'); head.className='sec-t';
  head.innerHTML = 'Attribute checklist — <span id="tvcCount">' + (sum.doneCount||0) + ' / ' + (YARD.total||0) + '</span> done';
  wrap.append(head);

  if (!YARD.rows.length) {
    const e = document.createElement('div'); e.className='saved';
    e.textContent = 'No wired attributes found for this station’s yard — complete Wiring / Termination mapping first.';
    wrap.append(e); return wrap;
  }

  const filter = document.createElement('input'); filter.type='text';
  filter.placeholder='Filter by cluster, location, asset, attribute…'; filter.style.marginBottom='8px';
  wrap.append(filter);

  const scroll = document.createElement('div'); scroll.className='tvc-scroll';
  const tbl = document.createElement('table'); tbl.className='ed tvc';
  tbl.innerHTML = '<thead><tr><th>Cluster</th><th>Location</th><th>Asset Type</th><th>Asset</th><th>Attribute</th><th>ADC</th><th class="c">Done</th></tr></thead>';
  const tb = document.createElement('tbody');
  YARD.rows.forEach((row) => {
    const tr = document.createElement('tr');
    tr.dataset.f = [row.cluster,row.location,row.assetType,row.asset,row.attribute,row.adc].map((x)=>x||'').join(' ').toLowerCase();
    tr.innerHTML =
      '<td title="'+esc(row.cluster)+'">'+esc(row.cluster)+'</td>' +
      '<td title="'+esc(row.location)+'">'+esc(row.location)+'</td>' +
      '<td title="'+esc(row.assetType)+'">'+esc(row.assetType)+'</td>' +
      '<td title="'+esc(row.asset)+'">'+esc(row.asset)+'</td>' +
      '<td title="'+esc(row.attribute)+'">'+esc(row.attribute)+'</td>' +
      '<td>'+esc(row.adc)+'</td>';
    const td = document.createElement('td'); td.className='c';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!sum.checks[row.lineId];
    cb.addEventListener('change', () => toggleYardRow(st, row.lineId, cb.checked, cb, setStatus));
    td.append(cb); tr.append(td); tb.append(tr);
  });
  tbl.append(tb); scroll.append(tbl); wrap.append(scroll);

  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    tb.querySelectorAll('tr').forEach((tr) => { tr.style.display = (!q || tr.dataset.f.indexOf(q) >= 0) ? '' : 'none'; });
  });
  return wrap;
}

async function toggleYardRow(st, lineId, done, cb, setStatus) {
  cb.disabled = true;
  const code = String(st.code).toUpperCase();
  try {
    const r = await apiPost('SaveYardChecklistItem', { siteId:SITE, stageCode:code, lineId, done, total:YARD.total });
    if (r && r.success) {
      const s = YARD.stages[code] || (YARD.stages[code] = { checks:{}, doneCount:0, total:YARD.total });
      s.checks[lineId] = done; s.doneCount = r.doneCount; s.total = r.total; s.status = r.status; s.statusId = r.statusId;
      const c = document.getElementById('tvcCount'); if (c) c.textContent = r.doneCount + ' / ' + r.total;
      if (setStatus) setStatus(r.statusId);
      $('savedState').textContent = 'Saved · ' + new Date().toLocaleTimeString();
      renderDetail();   // refresh the tile behind the open dialog
    } else { cb.checked = !done; toast((r && r.error) || 'Save failed'); }
  } catch (e) { cb.checked = !done; toast('Save failed: ' + e.message); }
  cb.disabled = false;
}

boot();
</script>
